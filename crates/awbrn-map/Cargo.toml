[package]
name = "awbrn-map"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
bevy = ["dep:bevy"]
# Generated TypeScript declarations for the editor wire types.
typescript = ["dep:tsify", "dep:wasm-bindgen", "awvm/typescript", "awbrn-types/typescript"]

[dependencies]
awbrn-types.path = "../awbrn-types"
awvm.path = "../awvm"
bevy = { workspace = true, optional = true }
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true
rstest.workspace = true
