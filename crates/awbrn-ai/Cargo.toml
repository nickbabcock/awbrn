[package]
name = "awbrn-ai"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

# The opponent. It depends on `awvm` and on the map crate that builds a
# starting position from one, and on nothing else: every tier above the first
# one runs headless self-play, and a dependency on the client would put a
# renderer and a frame loop in that path.

[dependencies]
anyhow.workspace = true
awbrn-game = { path = "../awbrn-game" }
awbrn-map = { path = "../awbrn-map" }
awbrn-image = { path = "../awbrn-image" }
awbrn-types = { path = "../awbrn-types" }
awvm = { path = "../awvm" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
