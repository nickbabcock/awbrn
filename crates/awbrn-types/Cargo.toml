[package]
name = "awbrn-types"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
default = []
bevy = ["dep:bevy"]
# Generated TypeScript declarations for the types that cross the wasm boundary.
typescript = ["awbw-types/typescript", "awvm/typescript"]

[dependencies]
awbw-types.path = "../awbw-types"
awvm = { path = "../awvm" }
bevy = { workspace = true, optional = true }
serde.workspace = true
