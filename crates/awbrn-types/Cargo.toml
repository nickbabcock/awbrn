[package]
name = "awbrn-types"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
default = []
bevy = ["dep:bevy"]
# Generated TypeScript declarations for the types that cross the wasm boundary.
typescript = ["dep:tsify", "dep:wasm-bindgen", "awvm/typescript"]

[dependencies]
awvm = { path = "../awvm" }
bevy = { workspace = true, optional = true }
jiff.workspace = true
serde.workspace = true
strum.workspace = true
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
