[package]
name = "awbrn-desktop"
version = "0.1.0"
edition = "2024"

[features]
default = ["bevy/dynamic_linking"]

[dependencies]
awbrn-client = { path = "../awbrn-client" }
awbrn-map = { path = "../awbrn-map" }
awbw-replay = { path = "../awbw-replay" }
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_log",
    "bevy_render",
    "bevy_sprite_render",
    "bevy_sprite",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "http",
    "https",
    "png",
    "sprite_picking",
    "std",
    "x11",
]}

[dev-dependencies]

[package.metadata.awbrn-desktop.release]
default-features = false
