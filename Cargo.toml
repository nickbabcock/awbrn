[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
anyhow = "1.0.104"
approx = "0.5.1"
bevy = { version = "0.20.1", default-features = false }
criterion = { version = "0.8", default-features = false }
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
gungraun = "0.20.0"
highway = "1.3.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
indexmap = { version = "2.14.2", features = ["serde"] }
insta = { version = "1.49.0", features = ["glob", "serde", "json"] }
jiff = { version = "0.2.45", default-features = false, features = ["std", "serde"] }
js-sys = "0.3.107"
oxipng = "10.2.1"
phpserz = "0.3.0"
png = "0.18.1"
raw-window-handle = { version = "0.6.2", features = ["wasm-bindgen-0-2"] }
rawzip = "0.5.1"
rayon = "1.12.0"
rectangle-pack = "0.4.2"
rstest = "0.28.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = { version = "0.11.1", default-features = false }
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
walkdir = "2.5"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = ["OffscreenCanvas"] }

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# https://bevyengine.org/learn/quick-start/getting-started/setup/#compile-with-performance-optimizations
# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Optimize for build time in CI.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
codegen-units = 4

[profile.ci.package."*"]
opt-level = 0

# Optimized build to fit under cloudflare 25 MB limit
[profile.release]
opt-level = 's'
lto = "thin"
# Stripping symbols would also drop the wasm `target_features` section, which
# lists the wasm features rustc enabled. wasm-bindgen reads it to decide
# whether its JS glue can use multivalue returns. wasm-opt removes the symbol
# names left in the wasm.
strip = "debuginfo"

# Optimize benchmarks for execution speed.
# Keep function symbols so that Callgrind can find benchmark entry points.
[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false

[profile.diag]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
