[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
anyhow = "1.0.102"
approx = "0.5.1"
bevy = { version = "0.19.1", default-features = false }
criterion = { version = "0.8", default-features = false }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
gungraun = "0.19.4"
highway = "1.3.0"
image = "0.25.10"
indexmap = { version = "2.9.0", features = ["serde"] }
insta = { version = "1.42.2", features = ["glob", "serde", "json"] }
jiff = { version = "0.2.35", default-features = false, features = ["std", "serde"] }
js-sys = "0.3.91"
oxipng = "10.0.0"
phpserz = "0.3.0"
raw-window-handle = { version = "0.6.2", features = ["wasm-bindgen-0-2"] }
rawzip = "0.5.1"
rayon = "1.11.0"
rectangle-pack = "0.4.2"
rstest = "0.25.0"
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.149"
serde_path_to_error = "0.1.15"
sha2 = { version = "0.11.0", default-features = false }
strum = { version = "0.27.1", features = ["derive"] }
thiserror = "2.0.18"
tracing = "0.1.44"
tsify = { version = "0.5.6", default-features = false, features = ["js"] }
walkdir = "2.5"
wasm-bindgen = "0.2.118"
web-sys = { version = "0.3.91", features = ["OffscreenCanvas"] }

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# https://bevyengine.org/learn/quick-start/getting-started/setup/#compile-with-performance-optimizations
# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Optimize for build time in CI.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
codegen-units = 4

[profile.ci.package."*"]
opt-level = 0

# Optimized build to fit under cloudflare 25 MB limit
[profile.release]
opt-level = 's'
lto = "thin"
strip = true

# Gungraun/Callgrind needs function symbols to locate library benchmark entry points.
[profile.bench]
strip = false
